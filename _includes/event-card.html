{%- assign e = include.event -%}
<li class="event-card">
  <div class="event-date">
    <span class="day">{{ e.date | date: "%-d" }}</span>
    <span class="mon">{{ e.date | date: "%b" }}</span>
    <span class="yr">{{ e.date | date: "%Y" }}</span>
  </div>
  <div>
    <h3><a href="{{ e.url | relative_url }}">{{ e.title }}</a></h3>
    <p class="meta">{{ e.location }}{% if e.format %} &middot; {{ e.format }}{% endif %}</p>
    {% if e.summary %}<p>{{ e.summary }}</p>{% endif %}
  </div>
</li>
