<a class="skip-link" href="#content">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/logo.svg' | relative_url }}" alt="" width="38" height="38">
      <span class="brand-text">
        <strong>Bioinformatics Hub</strong>
        <small>Nigeria</small>
      </span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="nav-burger" aria-label="Toggle navigation">&#9776;</label>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.navigation %}
        {% assign target = item.url | relative_url %}
        <a href="{{ target }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
