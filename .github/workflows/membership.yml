name: Membership

# Turns a "Join the Bioinformatics Hub" issue into a pull request against
# _data/members.yml. Editing the issue updates the same pull request.
on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: membership-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  member:
    if: >-
      contains(github.event.issue.labels.*.name, 'membership') ||
      startsWith(github.event.issue.title, '[Membership]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Read the form into _data/members.yml
        id: member
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/add_member.py

      - name: Check the file is still valid
        run: python scripts/validate_members.py

      - name: Open or update the pull request
        if: steps.member.outputs.action != 'unchanged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ steps.member.outputs.action }}
          MEMBER_NAME: ${{ steps.member.outputs.name }}
        run: |
          set -euo pipefail
          BRANCH="membership/${AUTHOR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add _data/members.yml
          git commit -m "${ACTION^} ${MEMBER_NAME} (@${AUTHOR}) in members.yml (#${ISSUE})"
          git push --force origin "$BRANCH"
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Membership: ${MEMBER_NAME} (@${AUTHOR})" \
              --body "Generated from #${ISSUE}. Closes #${ISSUE}." \
              --label membership
          else
            echo "Updated existing pull request #${EXISTING}."
          fi

      - name: Enable auto-merge (only if the repository variable is set)
        if: steps.member.outputs.action != 'unchanged' && vars.AUTO_MERGE_MEMBERSHIP == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: gh pr merge "membership/${AUTHOR}" --squash --auto --delete-branch

      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ steps.member.outputs.action }}
          ERROR: ${{ steps.member.outputs.error }}
        run: |
          if [ -n "$ERROR" ]; then
            gh issue comment "$ISSUE" --body "Sorry, the form could not be read: ${ERROR}"
          elif [ "$ACTION" = "unchanged" ]; then
            gh issue comment "$ISSUE" --body "Your entry is already up to date -- nothing to change. Thank you!"
          elif [ -n "$ACTION" ]; then
            gh issue comment "$ISSUE" --body "Thanks! A pull request that ${ACTION} your entry in \`_data/members.yml\` is open. Once a maintainer merges it you will appear on the [members page](https://bioinformaticshub.github.io/members/). Edit this issue at any time to change your details."
          fi
