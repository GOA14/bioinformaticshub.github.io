name: Join the Bioinformatics Hub
description: Add yourself to the members page, or update the details already there.
title: "[Membership]: "
labels: ["membership"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and a bot will open a pull request that adds you to
        `_data/members.yml`. Your GitHub username and profile photo are taken from the
        account you are posting with, so there is nothing to upload.

        Submitting the form again later **updates** your existing entry.
        Everything except the first three questions is optional &mdash; leave a field
        blank and it simply will not be shown.
  - type: input
    id: name
    attributes:
      label: Full name
      description: As you would like it displayed on the site.
      placeholder: Amina Bello
    validations:
      required: true
  - type: input
    id: institution
    attributes:
      label: Institution
      description: University, research institute, company, or "Independent".
      placeholder: Bayero University, Kano
    validations:
      required: true
  - type: dropdown
    id: interests
    attributes:
      label: Interests
      description: Pick everything that applies. Up to eight are shown on your card.
      multiple: true
      options:
        - Genomics
        - Transcriptomics / RNA-Seq
        - Single-cell analysis
        - Metagenomics / microbiome
        - Pathogen genomics / genomic surveillance
        - Antimicrobial resistance (AMR)
        - Cancer genomics
        - Population and evolutionary genetics
        - Variant analysis / WGS / WES
        - Structural bioinformatics / molecular docking
        - Drug discovery / cheminformatics
        - Systems biology / pathways and networks
        - Machine learning / AI in biology
        - Statistics and data visualisation
        - Workflows (Nextflow / Snakemake / Galaxy)
        - Programming (R / Python / Unix)
        - Databases and data management
        - Plant and agricultural genomics
        - Veterinary and animal genomics
        - Clinical bioinformatics
        - Science communication and training
        - Open science and reproducibility
    validations:
      required: true
  - type: input
    id: other_interests
    attributes:
      label: Other interests
      description: Anything not in the list above. Comma-separated.
      placeholder: Nanopore sequencing, phylogenetics
  - type: dropdown
    id: career_stage
    attributes:
      label: Career stage
      description: Used to group the members page. Everyone is welcome at any stage.
      options:
        - Undergraduate student
        - MSc student
        - MSc holder
        - PhD student
        - PhD holder
        - Postdoctoral researcher
        - Faculty / Principal investigator
        - Research scientist (institute or industry)
        - Other
    validations:
      required: true
  - type: dropdown
    id: title
    attributes:
      label: Job title
      description: >-
        Optional. Your position at your institution. Roles within the Bioinformatics Hub
        itself are assigned by the steering committee, not chosen here.
      options:
        - Research assistant
        - Research fellow
        - Research scientist
        - Bioinformatician
        - Data analyst
        - Laboratory scientist
        - Clinician / Medical doctor
        - Veterinarian
        - Graduate assistant
        - Assistant Lecturer
        - Lecturer
        - Senior Lecturer
        - Reader / Associate Professor
        - Professor
        - Head of department / Unit lead
        - Software engineer
        - Industry professional
        - Independent researcher
        - Other
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: Kano, Nigeria
  - type: input
    id: email
    attributes:
      label: Public email address
      description: Shown on your card. Leave blank if you would rather not publish it.
      placeholder: you@example.edu.ng
  - type: input
    id: website
    attributes:
      label: Website
      description: Full URL, including https://
      placeholder: https://example.org/~you
  - type: input
    id: orcid
    attributes:
      label: ORCID iD
      description: >-
        Digits only, e.g. 0000-0002-1825-0097. Required if you selected PhD holder,
        postdoc, faculty or research scientist. Free to create at orcid.org.
      placeholder: 0000-0002-1825-0097
  - type: input
    id: twitter
    attributes:
      label: X / Twitter handle
      description: Without the @
      placeholder: yourhandle
  - type: input
    id: linkedin
    attributes:
      label: LinkedIn
      description: Just the part after /in/
      placeholder: your-name-123
  - type: input
    id: bluesky
    attributes:
      label: Bluesky handle
      placeholder: you.bsky.social
  - type: input
    id: mastodon
    attributes:
      label: Mastodon profile URL
      placeholder: https://mstdn.science/@you
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I have read and agree to follow the Bioinformatics Hub Code of Conduct.
          required: true
  - type: checkboxes
    id: publish
    attributes:
      label: Publishing
      options:
        - label: I am happy for the details above to appear on the public members page.
          required: true
