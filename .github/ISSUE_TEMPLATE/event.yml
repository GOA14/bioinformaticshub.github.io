name: Propose an event
description: Suggest a meetup, workshop, journal club or training session.
title: "[Event]: "
labels: ["event"]
body:
  - type: input
    id: event_title
    attributes:
      label: Event title
    validations:
      required: true
  - type: input
    id: event_date
    attributes:
      label: Proposed date
      placeholder: 2026-03-14
    validations:
      required: true
  - type: input
    id: event_location
    attributes:
      label: Location
      placeholder: Online / Bayero University, Kano
    validations:
      required: true
  - type: dropdown
    id: event_format
    attributes:
      label: Format
      options:
        - Online meetup
        - In-person meetup
        - Hands-on workshop
        - Journal club
        - Hackathon
    validations:
      required: true
  - type: textarea
    id: event_summary
    attributes:
      label: What is it about?
      description: A paragraph we can put on the events page.
    validations:
      required: true
  - type: input
    id: event_host
    attributes:
      label: Who is hosting or organising?
