---
layout: default
---
<article class="wrap prose" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="page-head">
    <h1 itemprop="name headline">{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      {% if page.author %} &middot; {{ page.author }}{% endif %}
    </p>
    {% if page.tags.size > 0 %}
      <p class="tags">{% for t in page.tags %}<span class="tag">{{ t }}</span>{% endfor %}</p>
    {% endif %}
  </header>
  <div itemprop="articleBody">
    {{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">&larr; All posts</a></p>
</article>
